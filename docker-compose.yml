services:
  api:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////srv/data/social_studio.db
    volumes:
      - ./data:/srv/data
    ports:
      - "8000:8000"
    command: ["sh", "-c", "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  worker:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=sqlite:////srv/data/social_studio.db
    volumes:
      - ./data:/srv/data
    depends_on:
      - api
    command: ["python", "-m", "app.worker"]